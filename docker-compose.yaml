name: sparkdb
services:
  db:
    image: postgres:16.4
    container_name: sparkdb
    environment:
      POSTGRES_DB: Admin_DB
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: ${SPARKDB_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5000:5432"
    volumes:
      - /srv/server/storage/sparkdb/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - spark

networks:
  spark:
    external: true
